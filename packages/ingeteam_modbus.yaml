# Ingeteam hybrid inverter via the native `modbus` integration.
#
# This file is a Home Assistant package. Load it by adding, in configuration.yaml:
#
#     homeassistant:
#       packages: !include_dir_named packages
#
# The package name is the file name, so this file must live in the `packages/`
# directory (for example packages/ingeteam_modbus.yaml).
#
# Register addresses are PDU addresses into the input-registers block that begins
# at device register 30001 (PDU address 0) and is read with Modbus function 0x04.
# All reads are input registers; this configuration never writes to the inverter.
#
# --- Request-rate budget (read this before changing any interval) -------------
# The native integration issues ONE request per entity, so the steady-state
# request rate is (entities / scan_interval). The custom component this replaces
# read the whole 81-register block in a single request every 5 s. With the default
# per-entity scan_interval of 15 s and 54 entities, this hub issued about
# 3.6 requests/s (~18x the old component), which periodically overran the
# inverter's Modbus TCP server: responses arrived with stale transaction ids,
# pymodbus discarded them, retries were exhausted and the hub eventually closed
# the connection.
#
# The entities are therefore tiered by how fast their value can meaningfully move:
#   tier A  scan_interval 30 s    -> dynamic electrical values AND direction/status
#                                    signals (a direction register that lags makes the
#                                    dashboard look self-contradictory)
#   tier B  scan_interval 300 s   -> slow alarm/enum registers
#   tier C  scan_interval 1800 s  -> constants and absent hardware
# Steady-state rate: 36/30 + 4/300 + 14/1800 ~= 1.22 requests/s, about a 66%
# reduction. message_wait_milliseconds is raised 100 -> 250 so the device gets a
# quiet gap between requests and a transient stall can no longer cascade into a
# backlog. Do not shorten an interval without re-reading the request-rate budget
# in README.md. The only verified figures are 3.6 requests/s (which failed) and
# 1.22 requests/s (stable); ~1.5 requests/s is an untested guardrail, not a
# measured ceiling.
#
# A later revision moved `status_raw`, `battery_status_raw`,
# `ap_reduction_reason_raw` and `battery_discharge_limitation_reason_raw` from
# tier B to tier A: at 300 s the battery-direction register lagged a median of
# 337 s (max 1177 s), which made the battery appear to contradict its own
# direction and degraded every consumer of that signal.

modbus:
  - type: tcp
    name: ingeteam
    host: !secret ingeteam_host
    port: 502
    timeout: 5
    message_wait_milliseconds: 250
    sensors:
      - name: ingeteam Stop event code
        unique_id: ingeteam_stop_code
        address: 9
        input_type: input
        scan_interval: 300
        data_type: uint16
        scale: 1
        precision: 0
        state_class: measurement
      - name: ingeteam Alarm code
        unique_id: ingeteam_alarm_code
        address: 10
        input_type: input
        scan_interval: 300
        data_type: uint32
